# Install as /etc/nginx/sites-available/stroka and replace example.com.
# Place limit_req_zone in http context: /etc/nginx/conf.d/stroka-limit.conf
# limit_req_zone $binary_remote_addr zone=stroka_api:10m rate=1r/s;
server {
    listen 80;
    server_name example.com;
    root /home/poetry-editor/dist;
    index index.html;
    client_max_body_size 256k;

    location /api/ {
        limit_req zone=stroka_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    # JavaScript modules used by ONNX Runtime must not be served as octet-stream.
    location ~ \.mjs$ {
        types { application/javascript mjs; }
        default_type application/javascript;
        try_files $uri =404;
    }
    location ~ \.wasm$ {
        types { application/wasm wasm; }
        default_type application/wasm;
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
