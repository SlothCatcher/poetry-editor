<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Строка — редактор стихов</title><link rel="stylesheet" href="style.css"></head><body><header><a class="brand" href="#">✳ <span>строка</span></a><div class="header-right"><span id="saveStatus">Сохранено на устройстве</span><button id="export" class="button outline">↓ Скачать .txt</button></div></header><main><div class="intro"><div><div class="eyebrow">ВАШЕ ПРОСТРАНСТВО ДЛЯ ТВОРЧЕСТВА</div><h1>Пусть слова<br><em>найдут свой ритм.</em></h1><p>Место для мыслей, образов и строк, которые хочется сохранить.</p></div><div class="decoration">✳</div></div><div class="workspace"><aside><div class="aside-head"><div><span class="small-label">КОЛЛЕКЦИЯ</span><h2>Мои стихи <span id="count"></span></h2></div><button id="add" class="add" title="Новый стих" aria-label="Новый стих">＋</button></div><div id="list" class="list"></div><div class="aside-bottom">✧ <span>Каждая строка имеет значение.</span></div></aside><section class="editor"><div class="editor-top"><span><i></i> РЕДАКТОР</span><button id="delete" class="text-button">Удалить стих</button></div><input id="title" maxlength="120" aria-label="Название стихотворения" placeholder="Название стихотворения"><div class="rule"></div><textarea id="body" aria-label="Текст стихотворения" placeholder="Начните писать здесь...&#10;&#10;Каждая история начинается с первой строки."></textarea><div class="editor-bottom"><span id="stats">0 слов · 0 строк</span><span>Пишите в своём ритме ✦</span></div></section></div><footer>Создано для ваших слов <span>✳</span></footer></main><script src="app.js"></script></body></html>
